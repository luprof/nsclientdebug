[package]
name = "netskope-log-analyzer"
version = "0.1.0"
edition = "2021"
authors = ["Netskope Client Log Analyzer Team"]
description = "A GUI application for analyzing Netskope Client debug logs on Windows and macOS"

[dependencies]
eframe = "0.31"
egui = "0.31"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
rfd = "0.15"
